name: tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.md"
      - "schema/**"
      - "plugin/scripts/**"
      - "plugin/skills/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "**.md"
      - "schema/**"
      - "plugin/scripts/**"
      - "plugin/skills/**"
      - "tests/**"
      - ".github/workflows/test.yml"

jobs:
  smoke:
    name: smoke (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    # Force Python UTF-8 mode on every runner. Without this, windows-latest
    # uses cp1252 by default and any subprocess that prints a non-ASCII
    # character (e.g. "→" in schema_validate.py error messages) crashes
    # the reader thread of subprocess.run(..., text=True), producing the
    # "result.stdout is None" failure mode. PEP 686 makes UTF-8 mode the
    # default in Python 3.15+; until everyone is on 3.15, set it explicitly.
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show Python version
        run: python --version

      - name: Diagnostic — show runtime env (temp probe for Windows CI debug)
        if: runner.os == 'Windows'
        run: |
          python -c "import sys, locale, os; print('utf8_mode=', sys.flags.utf8_mode); print('defaultenc=', sys.getdefaultencoding()); print('stdout.enc=', sys.stdout.encoding); print('fs.enc=', sys.getfilesystemencoding()); print('locale.getencoding=', locale.getencoding()); print('PYTHONUTF8=', os.environ.get('PYTHONUTF8', '<unset>')); print('PYTHONIOENCODING=', os.environ.get('PYTHONIOENCODING', '<unset>')); print('LANG=', os.environ.get('LANG', '<unset>')); print('LC_ALL=', os.environ.get('LC_ALL', '<unset>'))"

      - name: Run smoke tests (with stdout capture for failure analysis)
        id: smoke
        shell: bash
        run: |
          # Tee stdout+stderr so the full log is both visible in CI UI
          # AND saved as a file we can upload as an artifact for anonymous
          # API access.
          set -o pipefail
          python tests/run_smoke.py 2>&1 | tee smoke-output.log

      - name: Upload smoke log on failure (so we can fetch via API)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}-py${{ matrix.python }}
          path: smoke-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Check SKILL.md is in sync with plugin/skills/
        run: python scripts/build_skill_md.py --check

      - name: Dreaming benchmark — market research
        run: python tests/run_dreaming_eval.py --fixture market_research --gate

  schema-check:
    name: schema integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JSON Schema is valid JSON
        run: python -c "import json; json.load(open('schema/wiki-schema.json'))"
      - name: All scripts compile
        run: |
          python -m compileall -q plugin/scripts/
          python -m compileall -q tests/
