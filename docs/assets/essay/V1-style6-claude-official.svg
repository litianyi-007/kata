<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 15px; fill: #6a6a6a; }
      .axis-label { font-size: 14px; fill: #6a6a6a; font-weight: 500; }
      .tick-label { font-size: 12px; fill: #6a6a6a; }
      .event-label { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .value-label { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .secondary-label { font-size: 11px; fill: #6a6a6a; }
      .callout-text { font-size: 13px; fill: #1a1a1a; }
      .callout-accent { font-size: 14px; font-weight: 700; fill: #b04a1f; }
      .legend-text { font-size: 14px; fill: #1a1a1a; }
      .legend-token { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .footer { font-size: 12px; fill: #6a6a6a; }
    </style>
  </defs>

  <!-- warm cream background -->
  <rect width="1200" height="760" fill="#f8f6f3"/>

  <text x="60" y="40" class="title">Wiki compounding &#8212; edges grow when synthesis is filed back</text>
  <text x="60" y="64" class="subtitle">NECallKit dogfood &#183; 2026-05-07 to 2026-05-08 &#183; kata edges vs imports</text>

  <!-- plot area: subtle beige panel -->
  <rect x="120" y="100" width="960" height="440" fill="#ffffff" stroke="#4a4a4a" stroke-width="2" rx="12"/>

  <!-- grid -->
  <line x1="120" y1="540" x2="1080" y2="540" stroke="#4a4a4a" stroke-width="1"/>
  <line x1="120" y1="477" x2="1080" y2="477" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="414" x2="1080" y2="414" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="351" x2="1080" y2="351" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="289" x2="1080" y2="289" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="226" x2="1080" y2="226" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="163" x2="1080" y2="163" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="120" y1="100" x2="1080" y2="100" stroke="#e8e6e3" stroke-width="0.5" stroke-dasharray="3,3"/>

  <text x="110" y="544" text-anchor="end" class="tick-label">0</text>
  <text x="110" y="481" text-anchor="end" class="tick-label">20</text>
  <text x="110" y="418" text-anchor="end" class="tick-label">40</text>
  <text x="110" y="355" text-anchor="end" class="tick-label">60</text>
  <text x="110" y="293" text-anchor="end" class="tick-label">80</text>
  <text x="110" y="230" text-anchor="end" class="tick-label">100</text>
  <text x="110" y="167" text-anchor="end" class="tick-label">120</text>
  <text x="110" y="104" text-anchor="end" class="tick-label">140</text>
  <text x="40" y="320" text-anchor="middle" class="axis-label" transform="rotate(-90, 40, 320)">edges</text>

  <!-- line: warm dark gray -->
  <path d="M 120,540 L 360,458 L 600,326 L 840,273 L 1080,119" fill="none" stroke="#4a4a4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- data points: teal-green agent color, except t3 highlight in coral -->
  <circle cx="120" cy="540" r="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
  <circle cx="360" cy="458" r="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
  <circle cx="600" cy="326" r="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>
  <circle cx="840" cy="273" r="10" fill="#f4e4c1" stroke="#b04a1f" stroke-width="3"/>
  <circle cx="1080" cy="119" r="8" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5"/>

  <text x="120" y="524" text-anchor="middle" class="value-label">0</text>
  <text x="360" y="444" text-anchor="middle" class="value-label">26</text>
  <text x="600" y="312" text-anchor="middle" class="value-label">68</text>
  <text x="840" y="255" text-anchor="middle" class="callout-accent">85</text>
  <text x="1060" y="107" text-anchor="end" class="value-label">134</text>

  <text x="140" y="555" class="secondary-label">pages=56</text>
  <text x="380" y="473" class="secondary-label">pages=61</text>
  <text x="620" y="341" class="secondary-label">pages=69</text>
  <text x="860" y="290" class="secondary-label">pages=70</text>
  <text x="1075" y="138" text-anchor="end" class="secondary-label">pages=77</text>

  <line x1="120" y1="540" x2="120" y2="546" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="360" y1="540" x2="360" y2="546" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="600" y1="540" x2="600" y2="546" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="840" y1="540" x2="840" y2="546" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="1080" y1="540" x2="1080" y2="546" stroke="#4a4a4a" stroke-width="1.5"/>

  <text x="120" y="585" text-anchor="middle" class="event-label">t0</text>
  <text x="360" y="585" text-anchor="middle" class="event-label">t1</text>
  <text x="600" y="585" text-anchor="middle" class="event-label">t2</text>
  <text x="840" y="585" text-anchor="middle" class="event-label" fill="#b04a1f">t3</text>
  <text x="1080" y="585" text-anchor="middle" class="event-label">t4</text>

  <!-- callouts: warm beige boxes -->
  <rect x="170" y="491" width="170" height="22" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1"/>
  <text x="255" y="506" text-anchor="middle" class="callout-text">+26 edges (+5 pages)</text>
  <rect x="410" y="378" width="170" height="22" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1"/>
  <text x="495" y="393" text-anchor="middle" class="callout-text">+42 edges (+8 pages)</text>
  <!-- highlight callout for t3: stronger warm orange box -->
  <rect x="660" y="220" width="200" height="48" rx="10" fill="#fef3e2" stroke="#b04a1f" stroke-width="2.5"/>
  <text x="760" y="241" text-anchor="middle" class="callout-accent">+17 edges from 1 page</text>
  <text x="760" y="259" text-anchor="middle" class="callout-text" font-weight="500">synthesis bonus</text>
  <line x1="785" y1="268" x2="840" y2="270" stroke="#b04a1f" stroke-width="2" stroke-dasharray="3,2"/>
  <rect x="900" y="182" width="170" height="22" rx="6" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1"/>
  <text x="985" y="197" text-anchor="middle" class="callout-text">+49 edges (+7 pages)</text>

  <text x="60" y="630" class="event-label">Events</text>
  <text x="60" y="652" class="legend-token">t0</text>
  <text x="100" y="652" class="legend-text">&#8212; Feature dossier imported (56 pages, 0 edges &#8212; the import baseline)</text>
  <text x="60" y="672" class="legend-token">t1</text>
  <text x="100" y="672" class="legend-text">&#8212; Two maintainer-decision queries filed (61 pages, 26 edges)</text>
  <text x="60" y="692" class="legend-token">t2</text>
  <text x="100" y="692" class="legend-text">&#8212; Project operating context imported (69 pages, 68 edges)</text>
  <text x="60" y="712" class="legend-token" fill="#b04a1f">t3</text>
  <text x="100" y="712" class="legend-text">&#8212; Operating-boundary query filed &#8212; <tspan font-weight="700" fill="#b04a1f">1 page, +17 edges</tspan> (70 pages, 85 edges)</text>
  <text x="60" y="732" class="legend-token">t4</text>
  <text x="100" y="732" class="legend-text">&#8212; Lessons seed (6 pages) + preflight query (1 page) (77 pages, 134 edges)</text>

  <text x="60" y="752" class="footer">Source: docs/dogfood-necallkit-hn-brief.md:40-47 &#183; V1 in essay-style-guide.md</text>

</svg>
